name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Mongoid ${{ matrix.mongoid }} / MongoDB ${{ matrix.mongodb }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '3.1', mongoid: '7', mongodb: '4.4' }
          - { ruby: '3.2', mongoid: '8', mongodb: '6.0' }
          - { ruby: '3.3', mongoid: '9', mongodb: '7.0' }
          - { ruby: '3.4', mongoid: '9', mongodb: '8.0' }
          - { ruby: '4.0', mongoid: '9', mongodb: '8.0' }
    env:
      MONGOID_VERSION: ${{ matrix.mongoid }}
    services:
      mongo:
        image: mongo:${{ matrix.mongodb }}
        ports: ["27017:27017"]
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/27017'"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rspec
