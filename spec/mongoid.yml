# Only `test:` is read — spec_helper calls `Mongoid.load!(.., :test)`.
# Every app's own mongoid.yml documents the options; this one runs a suite.
test:
  clients:
    default:
      database: mongoid_geospatial_test
      hosts:
        - localhost:27017
      options:
        read:
          mode: :primary
        max_pool_size: 1
